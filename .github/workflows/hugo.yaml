# Build the Hugo site once, then deploy it to:
#   1. GitHub Pages (Settings → Pages → Source = "GitHub Actions")
#   2. The cPanel host over FTPS (needs three repository secrets — see README)
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -qO ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build for cPanel host
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --destination public-cpanel --baseURL "${{ vars.SITE_URL || 'https://crew83.com/' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: site-cpanel
          path: public-cpanel
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --destination public --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cpanel:
    needs: build
    runs-on: ubuntu-latest
    # Skipped until the FTP secrets exist, so the workflow stays green before hosting is wired up.
    if: ${{ vars.CPANEL_DEPLOY == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-cpanel
          path: site
      - name: Upload to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
